name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint -- --max-warnings 10
      - run: npm run build
        env:
          WORDPRESS_API_URL: ${{ vars.WORDPRESS_API_URL || 'https://cms.example.com/graphql' }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET || 'dummy' }}
